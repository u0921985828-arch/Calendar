<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NEUROFLOW — Gestión estocástica del tiempo</title>
<style>
  :root {
    color-scheme: light;
    --ink: #111111;
    --paper: #ffffff;
    --cement: #f4f4f4;
    --action: #b8ff3c; /* verde neón — ejecutar / energía alta */
    --focus:  #00e5ff; /* cian — foco / atención */
    --signal: #ffe500; /* amarillo — energía media */
    --alert:  #ff3b30; /* rojo — energía baja / detener */
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", "Menlo", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cement);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    line-height: 1.4;
  }

  ::selection { background: var(--action); color: var(--ink); }

  :focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  .wrap {
    max-width: 1160px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  /* ---------- Cabecera de autoridad ---------- */
  header.masthead {
    border-bottom: 3px solid var(--ink);
    padding-bottom: 16px;
    margin-bottom: 28px;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
  }
  h1.brand {
    font-size: clamp(2.6rem, 7vw, 5.2rem);
    font-weight: 900;
    line-height: 0.86;
    letter-spacing: -0.045em;
    text-transform: uppercase;
    margin: 0;
  }
  .tagline {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.28em;
    color: rgba(17,17,17,0.6);
    margin-top: 8px;
  }
  .active-count {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: rgba(17,17,17,0.6);
    text-align: right;
  }
  .active-count b { font-size: 22px; color: var(--ink); display: block; letter-spacing: 0; }

  /* ---------- Bloques macizos ---------- */
  .block {
    border: 1px solid var(--ink);
    background: var(--paper);
    padding: 20px;
  }

  .grid-top {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 22px;
    align-items: start;
  }
  .col-left { display: flex; flex-direction: column; gap: 22px; }
  @media (max-width: 780px) {
    .grid-top { grid-template-columns: 1fr; }
  }

  .sec-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 8px;
  }
  .sec-head .idx {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    color: rgba(17,17,17,0.55);
  }
  .sec-head h2 {
    font-size: clamp(1.4rem, 2.4vw, 2rem);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .sec-head .meta {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    color: rgba(17,17,17,0.55);
  }

  /* ---------- Brain dump ---------- */
  form.dump { display: flex; gap: 12px; margin-top: 16px; }
  @media (max-width: 520px) { form.dump { flex-direction: column; } }
  input.dump-input {
    flex: 1;
    border: 1px solid var(--ink);
    background: var(--cement);
    padding: 14px 16px;
    font-family: var(--mono);
    font-size: 15px;
    color: var(--ink);
  }
  input.dump-input::placeholder { color: rgba(17,17,17,0.4); }

  button {
    font-family: var(--sans);
    cursor: pointer;
    border: 1px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: -0.01em;
    transition: transform 0.05s ease, box-shadow 0.05s ease, background 0.1s ease;
  }
  button:active { transform: translate(2px, 2px); }

  .btn-action {
    background: var(--action);
    padding: 14px 22px;
    white-space: nowrap;
  }
  .btn-action:hover { box-shadow: 4px 4px 0 0 var(--ink); }

  .btn-line {
    padding: 8px 12px;
    font-size: 12px;
  }
  .btn-line:hover { background: var(--focus); }

  /* ---------- Bandeja / triaje ---------- */
  ul.list { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .cap-item {
    display: flex; gap: 10px; align-items: center;
    border: 1px solid var(--ink);
    background: var(--cement);
    padding: 10px 12px;
    flex-wrap: wrap;
  }
  .cap-item .txt { flex: 1; font-family: var(--mono); font-size: 14px; min-width: 140px; }
  .triage { display: flex; align-items: center; gap: 4px; }
  .triage .lbl { font-family: var(--mono); font-size: 10px; text-transform: uppercase; color: rgba(17,17,17,0.5); margin-right: 2px; }
  .e-btn {
    border: 1px solid var(--ink);
    background: var(--paper);
    padding: 5px 8px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .e-btn.alta:hover { background: var(--action); }
  .e-btn.media:hover { background: var(--signal); }
  .e-btn.baja:hover { background: var(--alert); color: var(--paper); }
  .x-btn:hover { background: var(--alert); color: var(--paper); }
  .empty-inbox { display: none; }

  /* ---------- Dopamina / racha ---------- */
  .block.dark { background: var(--ink); color: var(--paper); }
  .dark .sec-head { border-color: rgba(255,255,255,0.3); }
  .dark .sec-head h2 { color: var(--paper); }
  .streak-row { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 8px; }
  .streak-row h2 { font-size: clamp(1.4rem,2.4vw,2rem); font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; margin: 0; }
  .streak-num { font-family: var(--mono); font-size: clamp(2.4rem,5vw,3.6rem); line-height: 1; color: var(--action); font-variant-numeric: tabular-nums; }
  .streak-num span { font-size: 14px; color: rgba(255,255,255,0.6); margin-left: 4px; vertical-align: top; }
  .routine-label { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255,255,255,0.6); margin: 18px 0 8px; }
  .cells { display: flex; gap: 6px; }
  .cell { height: 34px; flex: 1; border: 1px solid rgba(255,255,255,0.4); background: transparent; transition: background 0.2s ease; }
  .cell.on { background: var(--action); }

  /* ---------- Time blocks ---------- */
  .blocks-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 16px; }
  @media (max-width: 900px) { .blocks-grid { grid-template-columns: repeat(2,1fr); } }
  @media (max-width: 520px) { .blocks-grid { grid-template-columns: 1fr; } }
  .phase-col { border: 1px solid var(--ink); background: var(--cement); padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .phase-head { border-bottom: 1px solid var(--ink); padding-bottom: 8px; }
  .phase-head h3 { margin: 0; font-family: var(--mono); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; }
  .phase-head p { margin: 4px 0 0; font-size: 11px; color: rgba(17,17,17,0.6); }
  .phase-empty { text-align: center; font-family: var(--mono); font-size: 11px; text-transform: uppercase; color: rgba(17,17,17,0.3); padding: 18px 0; }

  /* ---------- Task card ---------- */
  .task {
    border: 1px solid var(--ink);
    background: var(--paper);
    padding: 12px;
  }
  .task.done { opacity: 0.45; }
  .task-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .task-title { font-size: 15px; font-weight: 800; line-height: 1.15; }
  .task.done .task-title { text-decoration: line-through; }
  .chip {
    display: inline-flex; align-items: center;
    border: 1px solid var(--ink);
    padding: 2px 7px;
    font-family: var(--mono);
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    white-space: nowrap;
  }
  .chip.alta { background: var(--action); }
  .chip.media { background: var(--signal); }
  .chip.baja { background: var(--alert); color: var(--paper); }
  .routine-tag {
    display: inline-block; margin-top: 8px;
    border: 1px solid var(--ink); background: var(--cement);
    padding: 2px 7px; font-family: var(--mono); font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .steps { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .step-row {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--ink); background: var(--cement);
    padding: 6px 8px; cursor: pointer;
  }
  .step-row input { appearance: none; -webkit-appearance: none; width: 16px; height: 16px; border: 1px solid var(--ink); background: var(--paper); flex-shrink: 0; cursor: pointer; margin: 0; }
  .step-row input:checked { background: var(--action); }
  .step-label { font-family: var(--mono); font-size: 13px; }
  .step-row.done .step-label { color: rgba(17,17,17,0.4); text-decoration: line-through; }
  .step-est { margin-left: auto; font-family: var(--mono); font-size: 11px; color: rgba(17,17,17,0.5); }
  .btn-breakdown { width: 100%; margin-top: 12px; padding: 8px; font-size: 13px; }
  .btn-breakdown:hover { background: var(--focus); }
  .task-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .task-foot .prog { font-family: var(--mono); font-size: 11px; text-transform: uppercase; color: rgba(17,17,17,0.6); }
  .btn-focus { padding: 6px 10px; font-size: 11px; }
  .btn-focus:hover { background: var(--focus); }
  .foot-done { font-family: var(--mono); font-size: 11px; font-weight: 700; text-transform: uppercase; }

  section.spacer { margin-top: 22px; }

  /* ---------- Hiperfoco overlay ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: var(--ink); color: var(--paper);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  .overlay.open { display: flex; }
  .overlay .exit {
    position: absolute; top: 20px; right: 20px;
    border: 1px solid rgba(255,255,255,0.4); background: transparent; color: rgba(255,255,255,0.7);
    padding: 6px 12px; font-family: var(--mono); font-size: 11px;
  }
  .overlay .exit:hover { background: var(--paper); color: var(--ink); }
  .overlay .kicker { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.3em; color: rgba(255,255,255,0.5); }
  .overlay .of-title { font-size: clamp(1.6rem, 4vw, 2.8rem); font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; max-width: 700px; margin: 12px 0 0; }
  .overlay .of-step { margin-top: 14px; border: 1px solid rgba(255,255,255,0.3); padding: 8px 16px; font-family: var(--mono); font-size: 14px; color: var(--focus); }
  .overlay .clock { margin-top: 40px; font-family: var(--mono); font-size: clamp(3.5rem, 12vw, 7rem); line-height: 1; color: var(--focus); font-variant-numeric: tabular-nums; }
  .overlay .clock.done { color: var(--action); }
  .overlay .ctrls { margin-top: 32px; display: flex; gap: 12px; }
  .overlay .ctrls button { padding: 12px 26px; font-size: 15px; }
  .of-pause { background: transparent; color: var(--paper); border-color: var(--paper); }
  .of-pause:hover { background: var(--paper); color: var(--ink); }
  .of-end { background: var(--action); border-color: var(--action); color: var(--ink); }
  .nudge {
    position: absolute; inset-inline: 0; bottom: 0;
    border-top: 1px solid var(--focus); background: var(--focus); color: var(--ink);
    padding: 16px 24px; display: none;
  }
  .nudge.show { display: block; }
  .nudge p { margin: 0; font-family: var(--mono); font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; }
  .nudge button { margin-top: 8px; border-color: var(--ink); background: transparent; padding: 5px 14px; font-size: 11px; }
  .nudge button:hover { background: var(--ink); color: var(--paper); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="masthead">
    <div>
      <h1 class="brand">Neuroflow</h1>
      <div class="tagline">Gestión estocástica del tiempo · TDAH + AACC</div>
    </div>
    <div class="active-count"><b id="activeNum">3</b> tareas activas</div>
  </header>

  <div class="grid-top">
    <div class="col-left">
      <!-- 01 · Brain dump -->
      <section class="block">
        <div class="sec-head">
          <span class="idx">01</span>
          <h2>Brain Dump</h2>
          <span class="meta" id="inboxMeta">0 en bandeja</span>
        </div>
        <form class="dump" id="dumpForm">
          <input class="dump-input" id="dumpInput" autocomplete="off"
                 placeholder="Suelta lo que tengas en la cabeza. No pienses, escribe." aria-label="Captura rápida" />
          <button type="submit" class="btn-action">Capturar</button>
        </form>
      </section>

      <!-- 02 · Bandeja / triaje -->
      <section class="block empty-inbox" id="inboxBlock">
        <div class="sec-head">
          <span class="idx">02</span>
          <h2>Bandeja</h2>
          <span class="meta">triaje diferido</span>
        </div>
        <ul class="list" id="inboxList"></ul>
      </section>
    </div>

    <!-- Dopamina operativa -->
    <section class="block dark">
      <div class="streak-row">
        <h2>Racha</h2>
        <div class="streak-num" id="streakNum">12<span>días</span></div>
      </div>
      <p class="routine-label">Rutina de hoy · <span id="routineText">3/6</span></p>
      <div class="cells" id="cells"></div>
    </section>
  </div>

  <!-- 03 · Time blocks -->
  <section class="block spacer">
    <div class="sec-head">
      <span class="idx">03</span>
      <h2>Bloques</h2>
      <span class="meta">por fase · sin reloj</span>
    </div>
    <div class="blocks-grid" id="blocksGrid"></div>
  </section>
</div>

<!-- Hiperfoco -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Modo hiperfoco">
  <button class="exit" id="ofExit">Salir · Esc</button>
  <div class="kicker">Hiperfoco</div>
  <h2 class="of-title" id="ofTitle"></h2>
  <div class="of-step" id="ofStep" style="display:none"></div>
  <div class="clock" id="ofClock">50:00</div>
  <div class="ctrls">
    <button class="of-pause" id="ofPause">Pausa</button>
    <button class="of-end" id="ofEnd">Terminar</button>
  </div>
  <div class="nudge" id="nudge">
    <p id="nudgeText"></p>
    <button id="nudgeAck">Hecho, sigo</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- Estado ----------
  var uid = 0;
  function id(p) { uid++; return (p || "n") + uid; }

  var ENERGY = {
    alta:  { label: "ALTA",  phase: "pico"   },
    media: { label: "MEDIA", phase: "meseta" },
    baja:  { label: "BAJA",  phase: "cierre" }
  };

  var PHASES = [
    { key: "arranque", label: "ARRANQUE", hint: "Encendido lento. Baja carga." },
    { key: "pico",     label: "PICO",     hint: "Máxima capacidad. Alta energía." },
    { key: "meseta",   label: "MESETA",   hint: "Sostener. Ejecución media." },
    { key: "cierre",   label: "CIERRE",   hint: "Descarga. Rutina y ordenar." }
  ];

  var tasks = [
    { id:"t1", title:"Cerrar propuesta cliente Nordvik", status:"planificada", energy:"alta", phase:"pico", steps:[
      { id:"t1s1", label:"Abrir el doc y releer brief", done:true, est:5 },
      { id:"t1s2", label:"Escribir 3 bullets de alcance", done:false, est:15 },
      { id:"t1s3", label:"Pegar precios de la plantilla", done:false, est:10 },
      { id:"t1s4", label:"Enviar a revisión interna", done:false, est:3 }
    ]},
    { id:"t2", title:"Contestar correos atrasados", status:"planificada", energy:"media", phase:"meseta", steps:[] },
    { id:"t3", title:"Lavar y guardar la ropa", status:"planificada", energy:"baja", phase:"cierre", routine:true, steps:[
      { id:"t3s1", label:"Meter carga a la lavadora", done:true },
      { id:"t3s2", label:"Tender / secadora", done:true },
      { id:"t3s3", label:"Doblar", done:false }
    ]},
    { id:"t4", title:"Tomar agua + estiramiento matutino", status:"hecha", energy:"baja", phase:"arranque", routine:true, steps:[] }
  ];

  var captures = [];
  var dopamine = { done: 3, total: 6, streak: 12 };

  // ---------- Desglose algorítmico ----------
  // En producción esto lo genera Claude a partir del texto + contexto de la
  // tarea (ver lib/breakdown.ts). Aquí, sin backend, aproximamos con un
  // clasificador local: detecta la NATURALEZA de la tarea e inyecta el objeto
  // real de la frase, para que los pasos hablen de ESA tarea y no de un molde.

  var VERBS = ["cerrar","abrir","escribir","redactar","contestar","responder","enviar",
    "llamar","agendar","reunir","lavar","limpiar","ordenar","comprar","pedir","pagar",
    "estudiar","leer","repasar","arreglar","implementar","programar","preparar","hacer",
    "revisar","terminar","organizar","planificar","buscar","actualizar","mandar","entregar"];

  // Devuelve el "objeto" de la tarea: la frase sin el verbo/artículo inicial.
  function objectOf(title) {
    var words = title.trim().split(/\s+/);
    if (words.length > 1) {
      var w0 = words[0].toLowerCase();
      var isVerb = VERBS.indexOf(w0) !== -1 || (w0.length > 3 && /(ar|er|ir)$/.test(w0));
      if (isVerb) words = words.slice(1);
      while (words.length > 1 && /^(a|el|la|los|las|un|una|de|del|mi|mis|tu|los)$/i.test(words[0])) {
        words = words.slice(1);
      }
    }
    var obj = words.slice(0, 6).join(" ");
    return obj || title.trim();
  }

  // Recetas por tipo. %s = objeto de la tarea. Primera coincidencia gana.
  var RECIPES = [
    { kw: ["correo","correos","email","mail","bandeja","responder","contestar"], steps: [
      { l: "Abrir la bandeja y filtrar: %s", e: 3 },
      { l: "Marcar los 3 más urgentes", e: 2 },
      { l: "Responder el más urgente (respuesta corta)", e: 8 },
      { l: "Contestar el resto en bloque", e: 12 },
      { l: "Archivar y vaciar la bandeja", e: 3 } ] },
    { kw: ["propuesta","documento","doc","informe","reporte","memo","presentación","presentacion"], steps: [
      { l: "Abrir el documento y releer el objetivo de: %s", e: 5 },
      { l: "Esquematizar el alcance en 3 bullets", e: 10 },
      { l: "Redactar el cuerpo sección por sección", e: 20 },
      { l: "Revisar datos, precios y formato", e: 8 },
      { l: "Enviar a revisión / entregar", e: 3 } ] },
    { kw: ["llamar","llamada","reunión","reunion","cita","contactar","agendar"], steps: [
      { l: "Anotar en 1 frase el objetivo de: %s", e: 2 },
      { l: "Buscar el contacto y el mejor horario", e: 3 },
      { l: "Escribir los 3 puntos a tratar", e: 5 },
      { l: "Hacer la llamada / reunión", e: 15 },
      { l: "Anotar acuerdos y el siguiente paso", e: 3 } ] },
    { kw: ["lavar","ropa","limpiar","limpieza","ordenar","cocina","platos","basura","aspirar","casa","baño","bano"], steps: [
      { l: "Reunir lo necesario para: %s", e: 3 },
      { l: "Empezar por la zona más visible", e: 5 },
      { l: "Completar la tarea física", e: 15 },
      { l: "Guardar / tender / secar", e: 8 },
      { l: "Dejar el espacio despejado", e: 4 } ] },
    { kw: ["comprar","compra","mercado","super","supermercado","pedir"], steps: [
      { l: "Listar lo que hace falta: %s", e: 4 },
      { l: "Revisar qué ya hay en casa", e: 3 },
      { l: "Elegir tienda / app y horario", e: 3 },
      { l: "Hacer la compra", e: 20 },
      { l: "Guardar y tachar de la lista", e: 5 } ] },
    { kw: ["pagar","pago","factura","banco","recibo","impuesto","transferencia","cuenta"], steps: [
      { l: "Reunir monto y datos de: %s", e: 3 },
      { l: "Abrir la app / banco y verificar saldo", e: 2 },
      { l: "Introducir los datos del pago", e: 4 },
      { l: "Confirmar y guardar el comprobante", e: 2 },
      { l: "Anotarlo en el registro de gastos", e: 2 } ] },
    { kw: ["estudiar","leer","lectura","repasar","aprender","curso","examen","apuntes"], steps: [
      { l: "Abrir el material: %s", e: 3 },
      { l: "Ojear el índice y fijar la meta de hoy", e: 4 },
      { l: "Leer / estudiar un bloque (25 min)", e: 25 },
      { l: "Resumir en 3 frases lo clave", e: 8 },
      { l: "Marcar dónde retomar mañana", e: 2 } ] },
    { kw: ["escribir","redactar","artículo","articulo","post","blog","texto","guion","guión","ensayo"], steps: [
      { l: "Definir en 1 frase de qué trata: %s", e: 3 },
      { l: "Volcar ideas en bruto (sin editar)", e: 10 },
      { l: "Ordenar en intro · cuerpo · cierre", e: 8 },
      { l: "Redactar el borrador completo", e: 25 },
      { l: "Revisar y pulir", e: 10 } ] },
    { kw: ["código","codigo","bug","programar","implementar","deploy","test","función","funcion","arreglar"], steps: [
      { l: "Reproducir / entender: %s", e: 8 },
      { l: "Localizar el archivo o la causa", e: 10 },
      { l: "Escribir el cambio mínimo", e: 20 },
      { l: "Probar (test / manual)", e: 8 },
      { l: "Commit y push", e: 3 } ] },
    { kw: ["ejercicio","correr","gimnasio","gym","entrenar","caminar","yoga","estirar","estiramiento","agua","hidrat"], steps: [
      { l: "Preparar ropa / espacio para: %s", e: 3 },
      { l: "Calentar 3 min", e: 3 },
      { l: "Hacer el bloque principal", e: 20 },
      { l: "Enfriar / estirar", e: 5 },
      { l: "Registrar que lo hiciste", e: 1 } ] }
  ];

  function breakdown(title) {
    var obj = objectOf(title);
    var low = title.toLowerCase();
    var recipe = null;
    for (var i = 0; i < RECIPES.length && !recipe; i++) {
      for (var j = 0; j < RECIPES[i].kw.length; j++) {
        if (low.indexOf(RECIPES[i].kw[j]) !== -1) { recipe = RECIPES[i]; break; }
      }
    }
    var steps = recipe ? recipe.steps : [
      // Fallback: aún referencia la tarea concreta, no un molde vacío.
      { l: "Aclarar en 1 frase qué es 'hecho' para: %s", e: 3 },
      { l: "Definir el primer movimiento concreto (2 min)", e: 2 },
      { l: "Ejecutar el núcleo de: %s", e: 15 },
      { l: "Revisar el resultado", e: 5 },
      { l: "Cerrar / entregar / guardar", e: 3 }
    ];
    return steps.map(function (s) {
      return { id: id("step"), label: s.l.replace(/%s/g, obj), done: false, est: s.e };
    });
  }

  // ---------- Utilidades DOM ----------
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }
  function $(sel) { return document.querySelector(sel); }

  // ---------- Render: dopamina ----------
  function renderDopamine() {
    $("#streakNum").innerHTML = dopamine.streak + '<span>días</span>';
    $("#routineText").textContent = dopamine.done + "/" + dopamine.total;
    var box = $("#cells");
    box.innerHTML = "";
    for (var i = 0; i < dopamine.total; i++) {
      box.appendChild(el("div", "cell" + (i < dopamine.done ? " on" : "")));
    }
  }

  // ---------- Render: bandeja ----------
  function renderInbox() {
    var list = $("#inboxList");
    list.innerHTML = "";
    $("#inboxMeta").textContent = captures.length + " en bandeja";
    $("#inboxBlock").style.display = captures.length ? "block" : "none";

    captures.forEach(function (c) {
      var li = el("li", "cap-item");
      li.appendChild(el("span", "txt", c.text));

      var tri = el("div", "triage");
      tri.appendChild(el("span", "lbl", "energía:"));
      ["alta", "media", "baja"].forEach(function (e) {
        var b = el("button", "e-btn " + e, ENERGY[e].label);
        b.onclick = function () { promote(c.id, e); };
        tri.appendChild(b);
      });
      var x = el("button", "e-btn x-btn", "✕");
      x.setAttribute("aria-label", "Descartar");
      x.onclick = function () { captures = captures.filter(function (n) { return n.id !== c.id; }); renderInbox(); };
      tri.appendChild(x);

      li.appendChild(tri);
      list.appendChild(li);
    });
  }

  // ---------- Render: task card ----------
  function taskCard(task) {
    var total = task.steps.length;
    var done = task.steps.filter(function (s) { return s.done; }).length;
    var isDone = task.status === "hecha";

    var card = el("article", "task" + (isDone ? " done" : ""));

    var top = el("div", "task-top");
    top.appendChild(el("div", "task-title", task.title));
    top.appendChild(el("span", "chip " + task.energy, ENERGY[task.energy].label));
    card.appendChild(top);

    if (task.routine) card.appendChild(el("span", "routine-tag", "Rutina"));

    if (total > 0) {
      var ul = el("ul", "steps");
      task.steps.forEach(function (step) {
        var row = el("label", "step-row" + (step.done ? " done" : ""));
        var cb = el("input");
        cb.type = "checkbox";
        cb.checked = step.done;
        cb.setAttribute("aria-label", step.label);
        cb.onchange = function () { toggleStep(task.id, step.id); };
        row.appendChild(cb);
        row.appendChild(el("span", "step-label", step.label));
        if (step.est) row.appendChild(el("span", "step-est", step.est + "m"));
        ul.appendChild(row);
      });
      card.appendChild(ul);
    } else if (!isDone) {
      var bd = el("button", "btn-breakdown", "Desglosar en micro-pasos");
      bd.onclick = function () { doBreakdown(task.id); };
      card.appendChild(bd);
    }

    var foot = el("div", "task-foot");
    foot.appendChild(el("span", "prog", total > 0 ? done + "/" + total + " pasos" : "sin desglosar"));
    if (!isDone) {
      var fb = el("button", "btn-focus", "Hiperfoco →");
      fb.onclick = function () { openFocus(task.id); };
      foot.appendChild(fb);
    } else {
      foot.appendChild(el("span", "foot-done", "✓ Hecha"));
    }
    card.appendChild(foot);
    return card;
  }

  // ---------- Render: bloques por fase ----------
  function renderBlocks() {
    var grid = $("#blocksGrid");
    grid.innerHTML = "";
    PHASES.forEach(function (ph) {
      var col = el("div", "phase-col");
      var head = el("div", "phase-head");
      head.appendChild(el("h3", null, ph.label));
      head.appendChild(el("p", null, ph.hint));
      col.appendChild(head);

      var phaseTasks = tasks.filter(function (t) { return t.phase === ph.key; });
      if (phaseTasks.length === 0) {
        col.appendChild(el("p", "phase-empty", "vacío"));
      } else {
        phaseTasks.forEach(function (t) { col.appendChild(taskCard(t)); });
      }
      grid.appendChild(col);
    });

    var active = tasks.filter(function (t) { return t.status !== "hecha"; }).length;
    $("#activeNum").textContent = active;
  }

  function renderAll() { renderInbox(); renderBlocks(); renderDopamine(); }

  // ---------- Acciones ----------
  function capture(text) {
    captures.unshift({ id: id("cap"), text: text });
    renderInbox();
  }

  function promote(capId, energy) {
    var node = captures.filter(function (c) { return c.id === capId; })[0];
    if (!node) return;
    tasks.unshift({
      id: id("task"), title: node.text, status: "planificada",
      energy: energy, phase: ENERGY[energy].phase, steps: []
    });
    captures = captures.filter(function (c) { return c.id !== capId; });
    renderAll();
  }

  function doBreakdown(taskId) {
    tasks.forEach(function (t) { if (t.id === taskId) t.steps = breakdown(t.title); });
    renderBlocks();
  }

  function toggleStep(taskId, stepId) {
    var task = tasks.filter(function (t) { return t.id === taskId; })[0];
    if (!task) return;
    var wasDone = task.status === "hecha";
    task.steps.forEach(function (s) { if (s.id === stepId) s.done = !s.done; });
    var allDone = task.steps.length > 0 && task.steps.every(function (s) { return s.done; });
    task.status = allDone ? "hecha" : "en-curso";

    // Dopamina operativa: al cerrar una rutina, sube el contador del día.
    if (task.routine && allDone && !wasDone && dopamine.done < dopamine.total) {
      dopamine.done += 1;
    }
    renderAll();
  }

  // ---------- Hiperfoco ----------
  var NUDGES = [
    { at: 5,  text: "Pausa fisiológica · Mira lejos 20 segundos. Descansa la vista." },
    { at: 12, text: "Pausa fisiológica · Toma agua." },
    { at: 20, text: "Pausa fisiológica · Recoloca la espalda. Hombros abajo." },
    { at: 30, text: "Pausa fisiológica · 3 respiraciones lentas." }
  ];
  var DURATION = 50 * 60;
  var focus = { taskId: null, elapsed: 0, running: false, timer: null, fired: {} };

  function fmt(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  function openFocus(taskId) {
    var task = tasks.filter(function (t) { return t.id === taskId; })[0];
    if (!task) return;
    focus = { taskId: taskId, elapsed: 0, running: true, timer: null, fired: {} };

    $("#ofTitle").textContent = task.title;
    var next = task.steps.filter(function (s) { return !s.done; })[0];
    var stepEl = $("#ofStep");
    if (next) { stepEl.textContent = "→ " + next.label; stepEl.style.display = "block"; }
    else { stepEl.style.display = "none"; }

    $("#nudge").classList.remove("show");
    $("#ofClock").classList.remove("done");
    $("#ofClock").textContent = fmt(DURATION);
    $("#ofPause").textContent = "Pausa";
    $("#ofPause").style.display = "inline-block";
    $("#overlay").classList.add("open");
    tick();
    startTimer();
  }

  function startTimer() {
    stopTimer();
    focus.timer = setInterval(function () {
      if (!focus.running) return;
      focus.elapsed = Math.min(focus.elapsed + 1, DURATION);
      tick();
      if (focus.elapsed >= DURATION) stopTimer();
    }, 1000);
  }
  function stopTimer() { if (focus.timer) { clearInterval(focus.timer); focus.timer = null; } }

  function tick() {
    var remaining = DURATION - focus.elapsed;
    var clock = $("#ofClock");
    if (remaining <= 0) { clock.textContent = "LISTO"; clock.classList.add("done"); $("#ofPause").style.display = "none"; }
    else { clock.textContent = fmt(remaining); }

    var min = Math.floor(focus.elapsed / 60);
    NUDGES.forEach(function (n) {
      if (n.at === min && !focus.fired[n.at]) {
        focus.fired[n.at] = true;
        $("#nudgeText").textContent = n.text;
        $("#nudge").classList.add("show");
      }
    });
  }

  function closeFocus() {
    stopTimer();
    $("#overlay").classList.remove("open");
    focus.taskId = null;
  }

  // ---------- Wiring ----------
  $("#dumpForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var v = $("#dumpInput").value.trim();
    if (!v) return;
    capture(v);
    $("#dumpInput").value = "";
    $("#dumpInput").focus();
  });

  $("#ofPause").addEventListener("click", function () {
    focus.running = !focus.running;
    this.textContent = focus.running ? "Pausa" : "Sigue";
  });
  $("#ofEnd").addEventListener("click", closeFocus);
  $("#ofExit").addEventListener("click", closeFocus);
  $("#nudgeAck").addEventListener("click", function () { $("#nudge").classList.remove("show"); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && $("#overlay").classList.contains("open")) closeFocus();
  });

  renderAll();
})();
</script>
</body>
</html>
