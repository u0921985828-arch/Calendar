name: APK Emulator Test

# Comprueba que el APK no solo compila, sino que ABRE en un Android real (emulado),
# sin FATAL EXCEPTION y con la MainActivity en primer plano. Sube una captura.
# Separado de "Build APK" para no ralentizar la publicación del artefacto.

on:
  workflow_dispatch:
  push:
    branches: ["claude/tdah-aacc-app-architecture-sogbdx"]
    paths:
      - "android/**"
      - "public/demo.html"
      - ".github/workflows/apk-emulator.yml"

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        working-directory: android
        env:
          NF_VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Instalar, lanzar y comprobar en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # OJO: android-emulator-runner ejecuta CADA línea con `sh -c` por separado,
          # así que toda comprobación debe caber en UNA sola línea (nada de if/fi multilínea).
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -n com.neuroflow.app/.MainActivity
            sleep 12
            adb exec-out screencap -p > screenshot.png
            echo "===== DIAGNÓSTICO logcat (NEUROFLOW / net / chromium) ====="
            adb logcat -d | grep -E 'NEUROFLOW_|net::ERR|chromium|WebViewAssetLoader' | head -60 || true
            echo "===== fin diagnóstico ====="
            adb logcat -d | grep -A 20 'FATAL EXCEPTION' && { echo "::error::La app crasheó (FATAL EXCEPTION)."; exit 1; } || echo "Sin FATAL EXCEPTION."
            adb shell dumpsys activity activities | grep -q 'com.neuroflow.app/.MainActivity' && echo "OK: la MainActivity está activa." || { echo "::error::La MainActivity no quedó en primer plano."; exit 1; }
            adb logcat -d | grep -q 'NEUROFLOW_LOAD_ERROR' && { echo "::error::onReceivedError de main frame: la app NO cargó (ver diagnóstico)."; exit 1; } || echo "Sin onReceivedError de main frame."
            adb logcat -d | grep -q 'NEUROFLOW_BOOTED' && echo "OK: la web app arrancó de verdad (NEUROFLOW_BOOTED)." || { echo "::error::La web app no ejecutó su JS dentro del WebView (no cargó)."; exit 1; }
            adb logcat -d | grep -q 'NEUROFLOW_SECURE=1 CRYPTO=1' && echo "OK: contexto seguro + WebCrypto disponibles en el dispositivo (el cifrado funciona)." || { echo "::error::No hay contexto seguro/WebCrypto en el dispositivo: el cifrado NO funcionaría."; adb logcat -d | grep -E 'NEUROFLOW_SECURE|isSecureContext' | head; exit 1; }

      - name: Subir captura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshot
          path: screenshot.png
          if-no-files-found: warn
