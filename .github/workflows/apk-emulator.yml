name: APK Emulator Test

# Comprueba que el APK no solo compila, sino que ABRE en un Android real (emulado),
# sin FATAL EXCEPTION y con la MainActivity en primer plano. Sube una captura.
# Separado de "Build APK" para no ralentizar la publicación del artefacto.

on:
  workflow_dispatch:
  push:
    branches: ["claude/tdah-aacc-app-architecture-sogbdx"]
    paths:
      - "android/**"
      - "public/demo.html"
      - ".github/workflows/apk-emulator.yml"

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Instalar, lanzar y comprobar en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.neuroflow.app/.MainActivity
            sleep 12
            adb exec-out screencap -p > screenshot.png
            if adb logcat -d | grep -q 'FATAL EXCEPTION'; then
              echo "::error::La app crasheó (FATAL EXCEPTION)."
              adb logcat -d | grep -A 20 'FATAL EXCEPTION' || true
              exit 1
            fi
            if ! adb shell dumpsys activity activities | grep -q 'com.neuroflow.app/.MainActivity'; then
              echo "::error::La MainActivity no quedó en primer plano."
              exit 1
            fi
            echo "OK: la app abrió sin crashes y la activity está activa."

      - name: Subir captura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshot
          path: screenshot.png
          if-no-files-found: warn
