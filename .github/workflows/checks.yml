name: Checks

on:
  workflow_dispatch:
  push:
    branches: ["claude/tdah-aacc-app-architecture-sogbdx"]
    paths:
      - "public/demo.html"
      - "public/manifest.webmanifest"
      - "tests/**"
      - ".github/workflows/checks.yml"

jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check del script de la app
        run: |
          node -e '
            const fs=require("fs");
            const html=fs.readFileSync("public/demo.html","utf8");
            const m=html.match(/<script>[\s\S]*?<\/script>/g);
            const last=m[m.length-1].replace(/^<script>/,"").replace(/<\/script>$/,"");
            fs.writeFileSync("/tmp/app.js",last);
          '
          node --check /tmp/app.js
          echo "Sintaxis OK"

      - name: Instalar Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: Auto-test e2e (?selftest)
        run: node tests/selftest.cjs
