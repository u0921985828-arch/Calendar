name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["claude/tdah-aacc-app-architecture-sogbdx"]
    paths:
      - "android/**"
      - "public/demo.html"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Neuroflow.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuroflow-apk
          path: Neuroflow.apk
          if-no-files-found: error

      - name: Publish to a release (opcional)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Neuroflow APK
          files: Neuroflow.apk
          make_latest: false
